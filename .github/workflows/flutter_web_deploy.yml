name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # Required permissions to publish to Github Pages
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Inject Environment Variables (API Key)
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/crate_d/" > build.log 2>&1
        continue-on-error: true

      - name: Upload Build Log Failure
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.log

      - name: Check Build Success
        run: |
          if grep -q "Error: Failed to compile" build.log; then
            echo "Build failed!"
            cat build.log
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
